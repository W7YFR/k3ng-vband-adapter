; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wemos_d1_mini32_ota

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-02A4KGLK
monitor_port = /dev/cu.usbserial-02A4KGLK
build_flags = !python3 scripts/hydrate_build_flags.py OTA_PASSWORD OTA_HOSTNAME
lib_deps =
    links2004/WebSockets @ ^2.4.1
    tzapu/WiFiManager @ ^2.0.17

; Wireless flashing: `pio run -e wemos_d1_mini32_ota -t upload`.
; espota needs a real IP, not the .local hostname -- inject_ota_auth.py
; resolves OTA_HOSTNAME from .env via mDNS on every upload and
; overrides upload_port below. Set IP=... in .env instead to skip
; resolution and target a fixed address (e.g. on Linux without
; avahi/nss-mdns, where mDNS resolution may not work).
[env:wemos_d1_mini32_ota]
extends = env:wemos_d1_mini32
extra_scripts =
    pre:scripts/inject_ota_auth.py
upload_protocol = espota
upload_port = 0.0.0.0
